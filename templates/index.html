<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブレインストーミングエンジン</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222e;
      --border: #2e2e3e;
      --text: #e8e8f0;
      --text-muted: #888899;
      --accent: #7c6af7;
      --accent-glow: rgba(124, 106, 247, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ヘッダー */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }

    /* メイン */
    main {
      max-width: 680px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    /* 投稿フォーム */
    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .post-card h2 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]::placeholder { color: var(--text-muted); }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    button.primary {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      white-space: nowrap;
    }

    button.primary:hover {
      background: #6a58e8;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    button.primary:active { transform: scale(0.97); }

    /* 議題一覧 */
    .section-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .section-header h2 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .count-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
    }

    .topic-list { display: flex; flex-direction: column; gap: 0.5rem; }

    .topic-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      overflow: hidden;
    }

    .topic-item:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .topic-item a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: var(--text);
      gap: 1rem;
    }

    .topic-title {
      font-size: 0.95rem;
      font-weight: 500;
      flex: 1;
    }

    .topic-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .topic-arrow {
      color: var(--text-muted);
      font-size: 0.85rem;
      transition: color 0.2s, transform 0.2s;
    }

    .topic-item:hover .topic-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      font-size: 0.9rem;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .empty .icon { font-size: 2rem; margin-bottom: 0.75rem; }

    @media (max-width: 540px) {
      header { padding: 1rem 1.25rem; }
      main { margin: 1.5rem auto; }
      .input-row { flex-direction: column; }
      .input-row button.primary { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🧠</div>
    <div>
      <h1>ブレインストーミングエンジン</h1>
      <p>AIペルソナが議論を展開するブレインストーミングツール</p>
    </div>
  </header>

  <main>
    <div class="post-card">
      <h2>新しい議題を投稿</h2>
      <form action="/topics" method="post" onsubmit="const b=this.querySelector('button');b.disabled=true;b.textContent='投稿中...'">
        <div class="input-row">
          <input type="text" name="title" placeholder="例：リモートワーク時代のチームビルディング" maxlength="200" required>
          <button type="submit" class="primary">投稿</button>
        </div>
      </form>
    </div>

    <div class="section-header">
      <h2>議題一覧</h2>
      <span class="count-badge">{{ topics | length }}</span>
    </div>

    {% if topics %}
      <ul class="topic-list" style="list-style:none">
        {% for topic in topics %}
        <li class="topic-item">
          <a href="/topics/{{ topic.id }}">
            <span class="topic-title">{{ topic.title }}</span>
            <span class="topic-meta">{{ topic.created_at.strftime('%Y/%m/%d') }}</span>
            <span class="topic-arrow">→</span>
          </a>
        </li>
        {% endfor %}
      </ul>
    {% else %}
      <div class="empty">
        <div class="icon">💡</div>
        まだ議題がありません。最初の議題を投稿してみましょう！
      </div>
    {% endif %}
  </main>
</body>
</html>
